<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="1200" height="12" role="presentation" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#22D3EE" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="0.8" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .dot { animation: pulse 3s ease-in-out infinite; transform-origin: 600px 6px; }
