<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Janarthanan S - Aspiring Software Engineer, Python Backend Developer, AI/ML Enthusiast" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03050F"/>
      <stop offset="0.6" stop-color="#080D1F"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E293B" stroke-width="0.6" opacity="0.55"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="320" fill="url(#gridFade)"/></mask>
  </defs>

  <style>
    .mono { font-family: 'Fira Code','JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace; }
    .sans { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .float-a { animation: floatA 9s ease-in-out infinite; }
    .float-b { animation: floatB 11s ease-in-out infinite; }
    .cursor  { animation: blink 1.1s steps(1) infinite; }
    .rise    { animation: rise 1.2s ease-out both; }
    .rise2   { animation: rise 1.2s ease-out 0.25s both; }
    .rise3   { animation: rise 1.2s ease-out 0.5s both; }
    @keyframes floatA { 0%,100% { transform: translate(0,0); }   50% { transform: translate(40px,18px); } }
    @keyframes floatB { 0%,100% { transform: translate(0,0); }   50% { transform: translate(-36px,-14px); } }
    @keyframes blink  { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes rise   { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" mask="url(#gridMask)"/>
  <g class="float-a"><ellipse cx="230" cy="90" rx="320" ry="170" fill="url(#glowCyan)"/></g>
  <g class="float-b"><ellipse cx="1000" cy="230" rx="340" ry="180" fill="url(#glowPurple)"/></g>

  <!-- left: identity -->
  <g class="rise">
    <text x="70" y="86" class="mono" font-size="15" fill="#22D3EE" letter-spacing="3">SOFTWARE ENGINEER · BACKEND · AI/ML</text>
  </g>
  <g class="rise2">
    <text x="66" y="165" class="sans" font-size="70" font-weight="700" fill="#F8FAFC" letter-spacing="-1">Janarthanan S</text>
    <rect x="70" y="186" width="150" height="4" rx="2" fill="url(#accent)"/>
  </g>
  <g class="rise3">
    <text x="70" y="232" class="sans" font-size="22" fill="#CBD5E1">Python Backend Developer · Problem Solver</text>
    <text x="70" y="264" class="sans" font-size="16" fill="#64748B">B.E. ECE · Madras Institute of Technology, Anna University</text>
  </g>

  <!-- right: code window -->
  <g class="rise3">
    <rect x="735" y="70" width="400" height="190" rx="12" fill="#0B1226" fill-opacity="0.85" stroke="#1E3A5F" stroke-width="1"/>
    <path d="M735 82a12 12 0 0 1 12-12h376a12 12 0 0 1 12 12v22H735z" fill="#101A33"/>
    <circle cx="758" cy="87" r="5" fill="#334155"/>
    <circle cx="776" cy="87" r="5" fill="#334155"/>
    <circle cx="794" cy="87" r="5" fill="#334155"/>
    <text x="1118" y="91" class="mono" font-size="11" fill="#64748B" text-anchor="end">janarthanan.py</text>

    <text x="758" y="136" class="mono" font-size="14" fill="#64748B"># what I do</text>
    <text x="758" y="162" class="mono" font-size="14"><tspan fill="#C084FC">focus</tspan><tspan fill="#94A3B8"> = [</tspan><tspan fill="#67E8F9">"backend"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#67E8F9">"apis"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#67E8F9">"ai/ml"</tspan><tspan fill="#94A3B8">]</tspan></text>
    <text x="758" y="188" class="mono" font-size="14"><tspan fill="#C084FC">solved</tspan><tspan fill="#94A3B8"> = </tspan><tspan fill="#67E8F9">"600+ LeetCode"</tspan></text>
    <text x="758" y="214" class="mono" font-size="14"><tspan fill="#C084FC">building</tspan><tspan fill="#94A3B8"> = </tspan><tspan fill="#67E8F9">"TrustPulse AI"</tspan></text>
    <rect class="cursor" x="758" y="226" width="9" height="16" fill="#22D3EE"/>
  </g>

  <!-- bottom accent line -->
  <rect x="0" y="316" width="1200" height="4" fill="url(#accent)" opacity="0.9"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
