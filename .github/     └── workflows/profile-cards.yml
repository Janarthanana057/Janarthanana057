name: Generate Profile Summary Cards

on:
  schedule:
    - cron: "0 1 * * *"   # daily
  workflow_dispatch:       # manual run from the Actions tab

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate cards
        uses: vn7n24fzkq/github-profile-summary-cards@release/v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 5   # IST is UTC+5:30; the action takes whole hours
